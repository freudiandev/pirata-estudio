version: "3.9"

x-security-hardening: &security-hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: pirate-studio-db
    restart: always
    networks:
      - pirate-studio-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Guayaquil
    volumes:
      - pirate_studio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:5434:5432"

  migrate:
    <<: *security-hardening
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: runtime
    container_name: pirate-studio-migrate
    networks:
      - pirate-studio-network
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      NODE_ENV: production
      TZ: America/Guayaquil
    entrypoint: ["./docker/migrate/entrypoint.sh"]
    restart: "no"
    tmpfs:
      - /tmp:size=64m

  web:
    <<: *security-hardening
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: runtime
    container_name: pirate-studio-web
    restart: always
    networks:
      - pirate-studio-network
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      PORT: 3000
      TZ: America/Guayaquil
    entrypoint: ["./docker/web/entrypoint.sh"]
    read_only: true
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pirate_studio_postgres_data:
  pirate_studio_node_modules:
  pirate_studio_next_cache:

networks:
  pirate-studio-network:
    driver: bridge
