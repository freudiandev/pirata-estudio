version: "3.9"

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: pirate-studio-db
    restart: always
    networks:
      - pirate-studio-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Guayaquil
    volumes:
      - pirate_studio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    ports:
      - target: 5432
        published: 5434
        protocol: tcp
        mode: host

  migrate:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: runtime
    container_name: pirate-studio-migrate
    networks:
      - pirate-studio-network
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      NODE_ENV: production
      TZ: America/Guayaquil
    entrypoint: ["./docker/migrate/entrypoint.sh"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: runtime
    container_name: pirate-studio-web
    restart: always
    networks:
      - pirate-studio-network
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      PORT: 3000
      TZ: America/Guayaquil
    entrypoint: ["./docker/web/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host

volumes:
  pirate_studio_postgres_data:

networks:
  pirate-studio-network:
    driver: bridge
